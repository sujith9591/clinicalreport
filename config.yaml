llm:
  provider: ollama
  model: llama3.2
  base_url: http://98.90.16.11:11434/ #http://34.207.216.209:11434
  temperature: 0
  max_tokens: 1500
  max_prompt_tokens: 1200
  timeout_seconds: 180
  max_retries: 3
  retry_backoff_factor: 1.5
  circuit_breaker_threshold: 5
  circuit_breaker_timeout: 60

rag:
  chunk_size: 512
  chunk_overlap: 64
  top_k: 8
  rerank_top_n: 5
  embedding_model: all-MiniLM-L6-v2
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  vector_store_path: ./vector_store

guardrails:
  ddi_block_severity:
    - MAJOR
  dose_tolerance_pct: 0.10
  validator_priority:
    - AllergyValidator
    - DDIValidator
    - ContraindicationValidator
    - DoseRangeValidator

agent:
  max_iterations: 3
  fallback_mode: evidence_summary_only

output:
  report_dir: ./reports
  max_reports: 7
  log_path: ./agent.log
  log_level: INFO

safety:
  disclaimer_text: This output is for decision-support only and must be reviewed by a qualified clinician before any clinical action is taken.
  enable_hipaa_compliance: true
  enable_gdpr_compliance: true
  enable_input_validation: true
  enable_output_validation: true
  enable_pii_detection: true
  audit_log_path: ./audit_logs
  audit_log_retention_days: 2555

observability:
  log_level: INFO
  log_format: json
  enable_structured_logging: true
  enable_request_tracing: true
  enable_metrics: true
  metrics_port: 9090
  trace_sample_rate: 1.0

health_check:
  enabled: true
  interval_seconds: 300
  timeout_seconds: 5
  endpoint_path: /health

